}

    }

}

    h32*=1883677709
    h32^=h32>>13
    h32*=2034071983
    h32^=h32>>16
    return h32/2147483647

            let v=1-(((((x*0.5+0.5|0)%20)&&((y*0.5+42|0)%((44+(Math.sin(107.1*(((x*0.5)/20)|0)*85)+1)*78|0)))?D.Noise2D(D.Noise1D(y*0.06*s,x*0.06*s)+x*-0.05*s,x*0.06*s+(x*0.5*s/20|0)*20)*200+20:90))/255)
            
            return [230*v,200*v,90*v,255]
        },
        (x,y)=>{//bedrock
            let v=D.Noise2D(y*20,x*20)*3+0.2
            v=Math.floor(v*5)/5
            v=(v+100)%1
            return [255*v,255*v,255*v,255]
        },
        (x,y)=>{//coal ore
            if(D.Noise2D(x*7.5,y*15)>0.08)
                return [50,50,50]
            let v=(D.Noise2D(x*30,y*30)+0.5)*0.4+0.9

            return [100*v,100*v,100*v,255]
        },
        (x,y)=>{//iron ore

        },
        (x,y)=>{//gold ore
            if(D.Noise2D(x*7.5,y*15)>0.08)

                    return [255,255,255]

            let v=(D.Noise2D(x*30,y*30)+0.5)*0.4+0.9

        },

        },

        },

        },
        (x,y)=>{//emerald ore

            let v=(D.Noise2D(x*30,y*30)+0.5)*0.4+0.9

            return [100*v,100*v,100*v,255]
        },
    ]
    
    
    let T=gl.createTexture()
    gl.bindTexture(gl.TEXTURE_2D_ARRAY,T)
    
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY,Math.floor(Math.log2(tileSize))+1,gl.RGBA8,tileSize,tileSize,layers)
    
    let data=new Uint8ClampedArray((tileSize*tileSize)<<2),inv_h=1/tileSize
    
    for(let t=0;t<texs.length;t++){
        let f=texs[t]
        for(let i=0,l=data.length;i<l;i+=4){
            let x=(i>>2)%tileSize,y=(i>>2)*inv_h|0
            let c=f(x*inv_h,y*inv_h)
            data[i]=c[0]
            data[i+1]=c[1]
            data[i+2]=c[2]
            data[i+3]=c[3]
        }
        gl.texSubImage3D(gl.TEXTURE_2D_ARRAY,0,0,0,t,tileSize,tileSize,1,gl.RGBA,gl.UNSIGNED_BYTE,data)
    }
    
    gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR)
    gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_MAG_FILTER,gl.LINEAR)

    gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_WRAP_T,gl.REPEAT)
    gl.generateMipmap(gl.TEXTURE_2D_ARRAY)
    
    if(aniso)
        gl.texParameterf(gl.TEXTURE_2D_ARRAY,aniso.TEXTURE_MAX_ANISOTROPY_EXT,gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT))

let doCollisionX=(p,dx)=>{
        
        if(Math.abs(dx)<0.0001)return
        
        let newX=p.x+dx,
            w=p.width,h=p.height
        
        if(dx>0){
            let bx=Math.round(newX+w),
                minY=Math.round(p.y+0.001),
                maxY=Math.round(p.y+h-0.001),
                minZ=Math.round(p.z-w),
                maxZ=Math.round(p.z+w)
                
            for(let y=minY;y<=maxY;y++)
                for(let z=minZ;z<=maxZ;z++)
                    if(getBlock(bx,y,z)){
                        p.vx=0
                        p.x=bx-0.5001-w
                        return
                    }
        }else{
            let bx=Math.round(newX-w),
                minY=Math.round(p.y+0.001),
                maxY=Math.round(p.y+h-0.001),
                minZ=Math.round(p.z-w),
                maxZ=Math.round(p.z+w)
                
            for(let y=minY;y<=maxY;y++)
                for(let z=minZ;z<=maxZ;z++)
                    if(getBlock(bx,y,z)){
                        p.vx=0
                        p.x=bx+0.501+w
                        return
                    }
        }
        p.x=newX
    },
    doCollisionZ=(p,dx)=>{
        
        if(Math.abs(dx)<0.0001)return
        
        let newX=p.z+dx,
            w=p.width,h=p.height
        
        if(dx>0){
            let bx=Math.round(newX+w),
                minY=Math.round(p.y+0.001),
                maxY=Math.round(p.y+h-0.001),
                minZ=Math.round(p.x-w),
                maxZ=Math.round(p.x+w)
                
            for(let y=minY;y<=maxY;y++)
                for(let z=minZ;z<=maxZ;z++)
                    if(getBlock(z,y,bx)){
                        p.vz=0
                        p.z=bx-0.5001-w
                        return
                    }
        }else{
            let bx=Math.round(newX-w),
                minY=Math.round(p.y+0.001),
                maxY=Math.round(p.y+h-0.001),
                minZ=Math.round(p.x-w),
                maxZ=Math.round(p.x+w)
                
            for(let y=minY;y<=maxY;y++)
                for(let z=minZ;z<=maxZ;z++)
                    if(getBlock(z,y,bx)){
                        p.vz=0
                        p.z=bx+0.5001+w
                        return
                    }
        }
        p.z=newX
    },
    doCollisionY=(p,dx)=>{
        
        if(Math.abs(dx)<0.0001)
            return
        
        let newX=p.y+dx,
            w=p.width,h=p.height
        
        if(dx>0){
            let bx=Math.round(newX+h),
                minY=Math.round(p.z-w),
                maxY=Math.round(p.z+w),
                minZ=Math.round(p.x-w),
                maxZ=Math.round(p.x+w)
                
            for(let y=minY;y<=maxY;y++)
                for(let z=minZ;z<=maxZ;z++)
                    if(getBlock(z,bx,y)){
                        p.vy=0
                        p.y=bx-0.5001-h
                        return
                    }
        }else{
            p.grounded=false
            let bx=Math.round(newX),
                minY=Math.round(p.z-w),
                maxY=Math.round(p.z+w),
                minZ=Math.round(p.x-w),
                maxZ=Math.round(p.x+w)
                
            for(let y=minY;y<=maxY;y++)
                for(let z=minZ;z<=maxZ;z++)
                    if(getBlock(z,bx,y)){
                        p.vy=0
                        p.y=bx+0.5001
                        p.grounded=true
                        return
                    }
        }
        p.y=newX
    }

        if(player.menu){
            
            inSlots=player.menu.getElementsByClassName('inSlot')
            outSlot=player.menu.getElementsByClassName('outSlot')[0]
            player.menu.style.display='block'
            player.drawInventory()
            
            for(let I=0;I<36+inSlots.length;I++){
                let i=I%36,
                    elem=I>=36?inSlots[i]:invSlots[i]
                elem.onmousedown=(e)=>{
                    
                    let inventory=I>=36?player.crafting:player.inventory,
                        inventoryCounts=I>=36?player.craftingCounts:player.inventoryCounts
                    let left=e.button===0
                    
                    if(player.holding){
                        if(left){
                            if(inventory[i]===player.holding){
                                inventoryCounts[i]+=player.holdingCount
                                player.holding=0
                                player.holdingCount=0
                                player.removeHoldingIcon()
                            }else{
                                let inv=inventory[i],invCo=inventoryCounts[i]
                                inventory[i]=player.holding
                                inventoryCounts[i]=player.holdingCount
                                player.holding=inv
                                player.holdingCount=invCo
                                if(!player.holding)
                                    player.removeHoldingIcon()
                                else
                                    player.setHoldingIcon(e.clientX,e.clientY)
                            }
                        }else if(!inventory[i] || inventory[i]===player.holding){
                            inventory[i]=player.holding
                            inventoryCounts[i]++
                            player.holdingCount--
                            
                            if(player.holdingCount<=0){
                                player.holding=0
                                player.removeHoldingIcon()
                            }else
                                player.setHoldingIcon(e.clientX,e.clientY)
                        }
                        
                    }else{
                        if(!inventory[i])return
                        
                        if(left){
                            if(keys.shift){
                                let t=inventory[i],
                                    c=inventoryCounts[i]
                                    inventory[i]=0
                                    inventoryCounts[i]=0
                                    player.distributeToInventory(t,c)
                            }else{
                                player.holding=inventory[i]
                                player.holdingCount=inventoryCounts[i]
                                inventory[i]=0
                                inventoryCounts[i]=0
                            }
                        }else{
                            let split=Math.ceil(inventoryCounts[i]*0.5)
                            player.holding=inventory[i]
                            player.holdingCount=split
                            inventoryCounts[i]-=split
                            if(inventoryCounts[i]<=0){
                                inventory[i]=0
                                inventoryCounts[i]=0
                            }
                        }
                        player.setHoldingIcon(e.clientX,e.clientY)
                        
                    }
                    
                    if(I>=36)player.runCrafts()
                    
                    player.drawInventory()
                }
            }
            
            if(outSlot)
                outSlot.onmousedown=(e)=>{
                    let left=e.button===0
                    
                    if(!player.crafted)return
                    
                    if(keys.shift){
                        
                        let enough=1e9
                        for(let i=0;i<9;i++)
                            if(player.crafting[i])
                                enough=Math.min(enough,player.craftingCounts[i])
                        
                        for(let i=0;i<9;i++)
                            if(player.crafting[i])
                                if((player.craftingCounts[i]-=enough)<=0)
                                    player.crafting[i]=0
                            
                        player.distributeToInventory(player.crafted,player.craftedCount*enough)
                    }else if(!player.holding || player.holding===player.crafted){
                        player.holding=player.crafted
                        player.holdingCount+=player.craftedCount
                        for(let i=0;i<9;i++)
                            if(player.crafting[i])
                                if((--player.craftingCounts[i])<=0)
                                    player.crafting[i]=0
                        player.setHoldingIcon(e.clientX,e.clientY)
                    }
                    
                    player.runCrafts()
                    player.drawInventory()
                }
            
            inventoryMenu.onmousedown=(e)=>{
                if(!player.holding)return
                
                let rect=inventoryBox.getBoundingClientRect(),
                    x=rect.x,
                    y=rect.y,
                    w=rect.width,
                    h=rect.height
                
                if(e.clientX<x-10||e.clientX>x+w+10||e.clientY<y-10||e.clientY>y+h+10){
                    player.ejectItem(player.holding,player.holdingCount)
                    player.holding=0
                    player.holdingCount=0
                    player.removeHoldingIcon()
                }
            }
            
        }else{
            if(player.holding){
                player.distributeToInventory(player.holding,player.holdingCount)
                player.removeHoldingIcon()
                player.holding=0
                player.holdingCount=0
            }
            for(let i=0;i<9;i++){
                if(player.crafting[i]){
                    player.distributeToInventory(player.crafting[i],player.craftingCounts[i])
                }
            }
            player.crafting.fill(0)
            player.craftingCounts.fill(0)
            player.drawHotbar()
        }
    }

            x=rect.x,y=rect.y,w=rect.width+6
        
        if(singular!==undefined){
            
            let i=singular
            
            overlayCtx.clearRect(x+w*i,y,w,w)
            
            overlayCtx.putImageData(itemSprites[player.inventory[i+27]],x+w*i,y)
            let count=player.inventoryCounts[i+27]
            if(count){
                overlayCtx.strokeText(count,x+w*i+w*0.8375,y+w*0.8825)
                overlayCtx.fillText(count,x+w*i+w*0.8,y+w*0.85)
            }
            
        }else{
        
            overlayCtx.clearRect(0,0,inWidth,inHeight)
            
            for(let i=0;i<9;i++){
                overlayCtx.putImageData(itemSprites[player.inventory[i+27]],x+w*i,y)
                let count=player.inventoryCounts[i+27]
                if(count){
                    overlayCtx.strokeText(count,x+w*i+w*0.8375,y+w*0.8825)
                    overlayCtx.fillText(count,x+w*i+w*0.8,y+w*0.85)
                }
            }
        }
    }
    player.drawHotbar()
    
    player.distributeToInventory=(id,count,eject=true)=>{
        let updateHotbar
        
        for(let j=0;j<72;j++){
            
            let _j=j%36,
                i=_j<9?27+_j:_j-9
            
            if(player.inventory[i]===id || j>=36 && !player.inventory[i]){
                let space=64-player.inventoryCounts[i]
                if(space>0){
                    space=Math.min(space,count)
                    count-=space
                    player.inventoryCounts[i]+=space
                    player.inventory[i]=id
                    
                    if(i>=27)updateHotbar=true
                    if(count<=0)break
                }
            }
        }
        
        if(count>0 && eject)
            player.ejectItem(id,count)
        
        if(player.menu)
            player.drawInventory()
        else if(updateHotbar)
            player.drawHotbar()
            
        return count
    }
    
    player.ejectItem=(id,count)=>{
        let s=5
        objects.push(new Item(player.x,player.y+player.eyes,player.z,-viewInfo.camDir[0]*s,-viewInfo.camDir[1]*s,-viewInfo.camDir[2]*s,id,count))
    }
    
    player.updateCreative=()=>{
        
        let speed=350*dt
            sinYaw=Math.sin(yaw),cosYaw=Math.cos(yaw),c=0,
            mx=0,mz=0
        
        if(!player.menu){
            if(keys.w){
                mx+=sinYaw
                mz-=cosYaw
                c++
            }
            if(keys.s){
                mx-=sinYaw
                mz+=cosYaw
                c++
            }
            if(keys.a){
                mx-=cosYaw
                mz-=sinYaw
                c++
            }
            if(keys.d){
                mx+=cosYaw
                mz+=sinYaw
                c++
            }
            if(keys[' ']){
                player.vy+=speed
            }
            if(keys.shift){
                player.vy-=speed
            }
            if(c>1){
                mx*=0.707106781
                mz*=0.707106781
            }
        }
        
        player.vx+=mx*speed
        player.vz+=mz*speed
        
        let f=1/(1+dt*15)
        player.vx*=f
        player.vy*=f
        player.vz*=f
        
        player.x+=player.vx*dt
        player.y+=player.vy*dt
        player.z+=player.vz*dt
    }
    
    player.update=()=>{
        
        let speed=(keys.shift?80:45)*dt
            sinYaw=Math.sin(yaw),cosYaw=Math.cos(yaw),c=0,
            mx=0,mz=0
        
        if(!player.menu){
            if(keys.w){
                mx+=sinYaw
                mz-=cosYaw
                c++
            }
            if(keys.s){
                mx-=sinYaw
                mz+=cosYaw
                c++
            }
            if(keys.a){
                mx-=cosYaw
                mz-=sinYaw
                c++
            }
            if(keys.d){
                mx+=cosYaw
                mz+=sinYaw
                c++
            }
            if(keys[' '] && player.grounded){
                player.vy=8
                player.grounded=false
            }
            if(c>1){
                mx*=0.707106781
                mz*=0.707106781
            }
        }
        
        player.vx+=mx*speed
        player.vz+=mz*speed
        
        let f=1/(1+dt*(player.grounded?15:12.5))
        player.vx*=f
        player.vz*=f
        
        player.vy-=25*dt
        
        let steps=Math.max(Math.abs(player.vy*dt*2)|0,1)
        for(let i=0;i<steps;i++)
            doCollisionY(player,player.vy*dt/steps)
            
        doCollisionX(player,player.vx*dt)
        doCollisionZ(player,player.vz*dt)
    }
    
    player.raycast=(x,y,z,dx,dy,dz,reach=7)=>{
        let vx=Math.floor(x+0.5),
            vy=Math.floor(y+0.5),
            vz=Math.floor(z+0.5),
            px=vx,py=vy,pz=vz,
            sx=Math.sign(dx)||1,
            sy=Math.sign(dy)||1,
            sz=Math.sign(dz)||1,
            tx=dx?Math.abs(1/dx):Infinity,
            ty=dy?Math.abs(1/dy):Infinity,
            tz=dz?Math.abs(1/dz):Infinity,
            mx=dx>0?(vx+0.5-x)*tx:(x-(vx-0.5))*tx,
            my=dy>0?(vy+0.5-y)*ty:(y-(vy-0.5))*ty,
            mz=dz>0?(vz+0.5-z)*tz:(z-(vz-0.5))*tz,
            dist=0
    
        while(dist<=reach){
            let bl=getBlock(vx,vy,vz)
            if(bl && bl!==blocks.water)
                return [[vx,vy,vz],[px,py,pz]]
            
            px=vx
            py=vy
            pz=vz
            
            if (mx<my){
                if(mx<mz){
                    vx+=sx
                    dist=mx
                    mx+=tx
                }else{
                    vz+=sz
                    dist=mz
                    mz+=tz
                }
            }else{
                if(my<mz){
                    vy+=sy
                    dist=my
                    my+=ty
                }else{
                    vz+=sz
                    dist=mz
                    mz+=tz
                }
            }
        }
        return false
    }
    
    player.placeBlock=()=>{
        
        let p=player.lookingAt
        
        if(p){
            if(getBlock(p[0],p[1],p[2])===B.craftingTable){
                player.menu=craftingTableMenu
                player.runInventory()
                return
            }
        }
        p=player.placingAt
        if(p){
            
            let w=player.width
            if(aabbTest(player.x-w,player.x+w,player.y,player.y+player.height,player.z-w,player.z+w,p[0]-0.5,p[0]+0.5,p[1]-0.5,p[1]+0.5,p[2]-0.5,p[2]+0.5))
                return
            
            let item=player.inventory[27+player.hotbarFocus]
            if(itemPlaceable[item]){
                placeBlock(p[0],p[1],p[2],item)
                
                if(!player.creative){
                    let count=--player.inventoryCounts[27+player.hotbarFocus]
                    if(count<=0)
                        player.inventory[27+player.hotbarFocus]=0
                    player.drawHotbar(player.hotbarFocus)
                }
            }
        }
    }
    player.destroyBlock=()=>{
        
        let p=player.lookingAt
        if(p){
            destroyBlock(p[0],p[1],p[2])
        }
    }
    
    return player
})()


let maxBlocksInChunk=16*256*16,

{

let posToInd=(ix,iy,iz)=>ix|(iz<<4)|(iy<<8),
    X=1,Y=1<<8,Z=1<<4,
    aoDarkness=0.9,
    aoFactor=(s1,s2,c)=>{
        return 0.9999-(1-(s1&&s2?0:1-(s1+s2+c)*0.33333))*aoDarkness
    },
    aoInt=(s1,s2,c)=>{
        return s1&s2?0:3-(s1+s2+c)
    }
    
let chunks=new Map(),
    lodChunks=[new Map(),new Map(),new Map()],
    renderDist=5,
    lodRanges=[[3,5],[3,6],[3,8]]
    
// lodRanges=[[3,5]]

let _OFFSET=1<<25,
    _BASE=1<<26,
    _ADD=_OFFSET*_BASE+_OFFSET,
    chunkKey=(x,z)=>x*_BASE+z+_ADD,
    getChunk=(x,z)=>chunks.get(chunkKey(x,z)),
    getBlock=(x,y,z)=>{
        let c=chunks.get(chunkKey(x>>4,z>>4))
        if(c && c.data)
            return c.data[posToInd(x&15,y,z&15)]
        return 0
    },
    getLight=(x,y,z)=>{
        let c=chunks.get(chunkKey(x>>4,z>>4))
        if(c)
            return c.light[posToInd(x&15,y,z&15)]
        return 0
    },
    saveModification=(cx,cz,ind,id)=>{
        let key=cx+','+cz,
            chunkData=MODS.get(key)
        if(!chunkData){
            chunkData=new Map()
            MODS.set(key,chunkData)
        }
        chunkData.set(ind,id)
        
        for(let i=0;i<lodRanges.length;i++){
            let key=chunkKey(cx>>(i+1),cz>>(i+1)),
                c=lodChunks[i].get(key)
            
            if(c){
                c.dispose()
                lodChunks[i].delete(key)
            }
        }
    },
    placeBlock=(x,y,z,b)=>{
        let cx=x>>4,cz=z>>4,
            c=getChunk(cx,cz)
        if(!c)return
        
        let ind,lightLvl=blockLightLevels[b]
        x&=15
        z&=15
        if(c.data[ind=posToInd(x,y,z)])return
        c.data[ind]=b
        
        saveModification(cx,cz,ind,b)
        
        let tempC=c
        c.constructMesh()
        if(x===0&&(c=getChunk(cx-1,cz)))c.constructMesh()
        if(x===15&&(c=getChunk(cx+1,cz)))c.constructMesh()
        if(z===0&&(c=getChunk(cx,cz-1)))c.constructMesh()
        if(z===15&&(c=getChunk(cx,cz+1)))c.constructMesh()
        if(x===0&&z===0&&(c=getChunk(cx-1,cz-1)))c.constructMesh()
        if(x===15&&z===0&&(c=getChunk(cx+1,cz-1)))c.constructMesh()
        if(x===15&&z===15&&(c=getChunk(cx+1,cz+1)))c.constructMesh()
        if(x===0&&z===15&&(c=getChunk(cx-1,cz+1)))c.constructMesh()
        c=tempC
        
        c.blockLightRQueue.push(packLightSeed(x,y,z,unpack_blockLight(c.light[ind])))
        c.light[ind]&=0xf0
        c.light[ind]=(c.light[ind]&0xf0)|lightLvl
        c.blockLightQueue.push(packLightSeed(x,y,z,lightLvl))
        
        //under sky
        if(y===255||unpack_skyLight(c.light[ind])===15){
            for(let i=y-1;i>=0;i--){
                if(!c.data[ind=posToInd(x,i,z)]){
                    c.light[ind]&=0x0f
                    c.skyLightRQueue.push(packLightSeed(x,i,z,15))
                }else
                    break
            }
        }
        c.skyLightRQueue.push(packLightSeed(x,y,z,unpack_skyLight(c.light[ind=posToInd(x,y,z)])))
        c.light[ind]&=0x0f
    },
    destroyBlock=(x,y,z)=>{
        let cx=x>>4,cz=z>>4,
            c=getChunk(cx,cz)
        if(!c)return
        
        x&=15
        z&=15
        
        let ind,lightLvl=blockLightLevels[c.data[ind=posToInd(x,y,z)]]
        
        objects.push(new Item(x+(cx<<4),y,z+(cz<<4),D.random(-1,1),D.random(1.5,3),D.random(-1,1),c.data[ind],1))
        
        c.data[ind]=0
        
        saveModification(cx,cz,ind,0)
        
        let tempC=c
        c.constructMesh()
        if(x===0&&(c=getChunk(cx-1,cz)))c.constructMesh()
        if(x===15&&(c=getChunk(cx+1,cz)))c.constructMesh()
        if(z===0&&(c=getChunk(cx,cz-1)))c.constructMesh()
        if(z===15&&(c=getChunk(cx,cz+1)))c.constructMesh()
        if(x===0&&z===0&&(c=getChunk(cx-1,cz-1)))c.constructMesh()
        if(x===15&&z===0&&(c=getChunk(cx+1,cz-1)))c.constructMesh()
        if(x===15&&z===15&&(c=getChunk(cx+1,cz+1)))c.constructMesh()
        if(x===0&&z===15&&(c=getChunk(cx-1,cz+1)))c.constructMesh()
        c=tempC
        
        //light source block was removed
        if(lightLvl){
            c.light[ind]&=0xf0
            c.blockLightRQueue.push(packLightSeed(x,y,z,lightLvl))
        }
        
        let newLvl=Math.max(unpack_blockLight(getLight(c.x+x-1,y,c.z+z)),unpack_blockLight(getLight(c.x+x+1,y,c.z+z)))
        newLvl=Math.max(unpack_blockLight(getLight(c.x+x,y-1,c.z+z)),newLvl)
        newLvl=Math.max(unpack_blockLight(getLight(c.x+x,y+1,c.z+z)),newLvl)
        newLvl=Math.max(unpack_blockLight(getLight(c.x+x,y,c.z+z-1)),newLvl)
        newLvl=Math.max(unpack_blockLight(getLight(c.x+x,y,c.z+z+1)),newLvl)
        if(newLvl>0){//seeding with lvl 0 will mark chunk neighbors as dirty
            newLvl--
            c.light[ind]=(c.light[ind]&0xf0)|newLvl
            c.blockLightQueue.push(packLightSeed(x,y,z,newLvl))
        }
        
        if(y===255||unpack_skyLight(c.light[ind+Y])===15){
            for(let i=y;i>=0;i--){
                if(!c.data[ind=posToInd(x,i,z)]){
                    c.light[ind]=(c.light[ind]&0x0f)|(15<<4)
                    c.skyLightQueue.push(packLightSeed(x,i,z,15))
                }else
                    break
            }
        }else{
            newLvl=Math.max(unpack_skyLight(getLight(c.x+x-1,y,c.z+z)),unpack_skyLight(getLight(c.x+x+1,y,c.z+z)))
            newLvl=Math.max(unpack_skyLight(getLight(c.x+x,y-1,c.z+z)),newLvl)
            newLvl=Math.max(unpack_skyLight(getLight(c.x+x,y+1,c.z+z)),newLvl)
            newLvl=Math.max(unpack_skyLight(getLight(c.x+x,y,c.z+z-1)),newLvl)
            newLvl=Math.max(unpack_skyLight(getLight(c.x+x,y,c.z+z+1)),newLvl)
            if(newLvl>0){
                newLvl--
                c.light[ind]=(c.light[ind]&0x0f)|(newLvl<<4)
                c.skyLightQueue.push(packLightSeed(x,y,z,newLvl))
            }
        }
    },
    aabbTest=(minX1,maxX1,minY1,maxY1,minZ1,maxZ1,minX2,maxX2,minY2,maxY2,minZ2,maxZ2)=>{
        return minX1<=maxX2&&maxX1>=minX2&&
            minY1<=maxY2&&maxY1>=minY2&&
            minZ1<=maxZ2&&maxZ1>=minZ2
    },
    emptyArr=new Array(maxBlocksInChunk).fill(-1),
    emptyLightArr=new Array(maxBlocksInChunk).fill(0xf0),
    getChunkData=(x,z)=>{
        let c=chunks.get(chunkKey(x,z))
        return c?c.data:emptyArr
    },
    getChunkLight=(x,z)=>{
        let c=chunks.get(chunkKey(x,z))
        return c?c.light:emptyLightArr
    },
    chunkRenderSortingFunc=(a,b)=>a.distToPlayer-b.distToPlayer,
    chunkGenSortingFunc=(a,b)=>a[2]-b[2],
    dirtiedThisFrame=false,
    reprunedThisFrame=false,
    someLightingChanged=false

let greedyXZ=new Uint16Array(16*256),
    greedyY=new Uint16Array(16*16),
    greedyXZ_light=new Uint32Array(16*256),
    greedyY_light=new Uint32Array(16*16),
    packFace=(a00,a10,a11,a01,type)=>(a00)|(a10<<2)|(a11<<4)|(a01<<6)|(type<<8),
    unpack_a00=(n)=>1-(1-(n&3)*0.333)*aoDarkness,
    unpack_a10=(n)=>1-(1-((n>>2)&3)*0.333)*aoDarkness,
    unpack_a11=(n)=>1-(1-((n>>4)&3)*0.333)*aoDarkness,
    unpack_a01=(n)=>1-(1-((n>>6)&3)*0.333)*aoDarkness,
    unpack_type=(n)=>n>>8,
    packFaceLight=(l00,l10,l11,l01)=>((l00)|(l10<<8)|(l11<<16)|(l01<<24))>>>0,
    unpack_l00=(n)=>n&255,
    unpack_l10=(n)=>(n>>>8)&255,
    unpack_l11=(n)=>(n>>>16)&255,
    unpack_l01=(n)=>(n>>>24)&255,
    
    packLight=(sky,block)=>(sky<<4)|block,
    unpack_skyLight=(n)=>n>>4,
    unpack_blockLight=(n)=>n&15,
    avgLight=(a,b,c,d,solidB,solidC,solidD)=>{//a is the direct front, d is corner
        let count=1,sumSky=unpack_skyLight(a),sumBlock=unpack_blockLight(a)
        if(!solidB){
            sumSky+=unpack_skyLight(b)
            sumBlock+=unpack_blockLight(b)
            count++
        }
        if(!solidC){
            sumSky+=unpack_skyLight(c)
            sumBlock+=unpack_blockLight(c)
            count++
        }
        if(!solidD&&(!solidB||!solidC)){
            sumSky+=unpack_skyLight(d)
            sumBlock+=unpack_blockLight(d)
            count++
        }
        return packLight(Math.round(sumSky/count),Math.round(sumBlock/count))
    },
    canCombine=(mask,maskLight,ind,face,faceLight)=>{
        return mask[ind]===face && maskLight[ind]===faceLight || mask[ind] && maskLight[ind]===0 && faceLight===0
    },
    globalGreedyMeshScale=1,

class Chunk{
    
    constructor(ix,iz){
        
        chunks.set(chunkKey(ix,iz),this)
        
        this.scale=1
        this.ix=ix
        this.iz=iz
        this.x=ix<<4
        this.z=iz<<4
        this.minX=this.x-0.5
        this.minY=0
        this.minZ=this.z-0.5
        this.maxX=this.x+15.5
        this.maxY=256
        this.maxZ=this.z+15.5
        this.mx=(this.minX+this.maxX)*0.5
        this.mz=(this.minZ+this.maxZ)*0.5
        this.data=emptyArr
        this.buffer=gl.createBuffer()
        this.vao=gl.createVertexArray()
        this.indexAmount=0
        gl.bindVertexArray(this.vao)
        gl.bindBuffer(gl.ARRAY_BUFFER,this.buffer)
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,trisBuffer)
        
        this.light=emptyLightArr
        this.tops=new Uint8Array(16*16)
        this.skyLightQueue=[]
        this.blockLightQueue=[]
        this.skyLightRQueue=[]
        this.blockLightRQueue=[]
        this.lightDirty=Infinity
        this.unspreadDirty=0
        
        this.constructMesh=this.constructMesh
    }
    
    receiveWorkerData(data){
        
        if(!data)return
        
        let neigh,ix=this.ix,iz=this.iz
        if(neigh=getChunk(ix+1,iz))neigh.dirty=true
        if(neigh=getChunk(ix-1,iz))neigh.dirty=true
        if(neigh=getChunk(ix,iz+1))neigh.dirty=true
        if(neigh=getChunk(ix,iz-1))neigh.dirty=true
        if(neigh=getChunk(ix-1,iz-1))neigh.dirty=true
        if(neigh=getChunk(ix+1,iz-1))neigh.dirty=true
        if(neigh=getChunk(ix+1,iz+1))neigh.dirty=true
        if(neigh=getChunk(ix-1,iz+1))neigh.dirty=true
        
        this.data=data
        this.light=new Uint8Array(maxBlocksInChunk)
        this.collectBorderLights()
        this.initalizeLights()
        this.constructMesh()
    }
    
    readyNeighbors(){
        this.NxC=getChunk(this.ix-1,this.iz)
        this.PxC=getChunk(this.ix+1,this.iz)
        this.NzC=getChunk(this.ix,this.iz-1)
        this.PzC=getChunk(this.ix,this.iz+1)
        this.Nx=getChunkData(this.ix-1,this.iz)
        this.Px=getChunkData(this.ix+1,this.iz)
        this.Nz=getChunkData(this.ix,this.iz-1)
        this.Pz=getChunkData(this.ix,this.iz+1)
        this.NxL=getChunkLight(this.ix-1,this.iz)
        this.PxL=getChunkLight(this.ix+1,this.iz)
        this.NzL=getChunkLight(this.ix,this.iz-1)
        this.PzL=getChunkLight(this.ix,this.iz+1)
    }
    
    initalizeLights(){
        let data=this.data,
            light=this.light,
            tops=this.tops
        tops.fill(0)
        for(let x=0;x<16;x++)
            for(let z=0;z<16;z++){
                let skyLightStopped=false
                for(let y=255;y>=0;y--){
                    let ind=posToInd(x,y,z),
                        block=data[ind],
                        llvl=blockLightLevels[block]
                        
                    if(!skyLightStopped){
                        if(block){
                            tops[(z<<4)|x]=y
                            skyLightStopped=true
                        }else
                            light[ind]|=0xf0
                    }
                    if(llvl){
                        light[ind]|=0x0f
                        this.blockLightQueue.push(packLightSeed(x,y,z,llvl))
                    }
                }
            }
        
        for(let x=0;x<16;x++)
            for(let z=0;z<16;z++){
                let ind=(z<<4)|x
                for(let y=tops[ind]+1;y<256;y++){
                    if(x===0||tops[ind-1]>y||x===15||tops[ind+1]>y||z===0||tops[ind-16]>y||z===15||tops[ind+16]>y)
                        this.skyLightQueue.push(packLightSeed(x,y,z,15))
                    
                }
            }
        
        this.readyNeighbors()
        this.spreadSkyLight()
    }
    
    spreadSkyLight(){
        
        let lightQueue=this.skyLightQueue,
            data=this.data,
            light=this.light,
            start=0
        while(start<lightQueue.length){
            let lightSeed=lightQueue[start++],
                x=unpackLightSeed_x(lightSeed),
                y=unpackLightSeed_y(lightSeed),
                z=unpackLightSeed_z(lightSeed),
                v=unpack_skyLight(light[posToInd(x,y,z)]),
                nx=posToInd(15,y,z),
                px=posToInd(0,y,z),
                nz=posToInd(x,y,15),
                pz=posToInd(x,y,0),
                ind
            
            if(x===0 && this.NxC)
                this.NxC.lightDirty=frameCount
            if(x===15 && this.PxC)
                this.PxC.lightDirty=frameCount
            if(z===0 && this.NzC)
                this.NzC.lightDirty=frameCount
            if(z===15 && this.PzC)
                this.PzC.lightDirty=frameCount
            
            if(v<=1)continue
            
            if(x===0 && this.Nx[nx]===0 && unpack_skyLight(this.NxL[nx])<v-1){
                this.NxC.skyLightQueue.push(packLightSeed(15,y,z,v-1))
                this.NxL[nx]=(this.NxL[nx]&0x0f)|((v-1)<<4)
            }
            if(x===15 && this.Px[px]===0 && unpack_skyLight(this.PxL[px])<v-1){
                this.PxC.skyLightQueue.push(packLightSeed(0,y,z,v-1))
                this.PxL[px]=(this.PxL[px]&0x0f)|((v-1)<<4)
            }
            if(z===0 && this.Nz[nz]===0 && unpack_skyLight(this.NzL[nz])<v-1){
                this.NzC.skyLightQueue.push(packLightSeed(x,y,15,v-1))
                this.NzL[nz]=(this.NzL[nz]&0x0f)|((v-1)<<4)
            }
            if(z===15 && this.Pz[pz]===0 && unpack_skyLight(this.PzL[pz])<v-1){
                this.PzC.skyLightQueue.push(packLightSeed(x,y,0,v-1))
                this.PzL[pz]=(this.PzL[pz]&0x0f)|((v-1)<<4)
            }
            
            if(x!==0 && !data[ind=posToInd(x-1,y,z)] && unpack_skyLight(light[ind])<v-1){
                lightQueue.push(packLightSeed(x-1,y,z,v-1))
                light[ind]=(light[ind]&0x0f)|((v-1)<<4)
            }
            if(x!==15 && !data[ind=posToInd(x+1,y,z)] && unpack_skyLight(light[ind])<v-1){
                lightQueue.push(packLightSeed(x+1,y,z,v-1))
                light[ind]=(light[ind]&0x0f)|((v-1)<<4)
            }
            if(y!==0 && !data[ind=posToInd(x,y-1,z)] && unpack_skyLight(light[ind])<v-1){
                lightQueue.push(packLightSeed(x,y-1,z,v-1))
                light[ind]=(light[ind]&0x0f)|((v-1)<<4)
            }
            if(y!==255 && !data[ind=posToInd(x,y+1,z)] && unpack_skyLight(light[ind])<v-1){
                lightQueue.push(packLightSeed(x,y+1,z,v-1))
                light[ind]=(light[ind]&0x0f)|((v-1)<<4)
            }
            if(z!==0 && !data[ind=posToInd(x,y,z-1)] && unpack_skyLight(light[ind])<v-1){
                lightQueue.push(packLightSeed(x,y,z-1,v-1))
                light[ind]=(light[ind]&0x0f)|((v-1)<<4)
            }
            if(z!==15 && !data[ind=posToInd(x,y,z+1)] && unpack_skyLight(light[ind])<v-1){
                lightQueue.push(packLightSeed(x,y,z+1,v-1))
                light[ind]=(light[ind]&0x0f)|((v-1)<<4)
            }
        }
        
        this.skyLightQueue.length=0

                            let bL=(eL?(cL=NxL,Nx)[iL=posToInd(15,iy+1,iz)]:(cL=dataL,data)[iL=i-X+Y])>0,

    renderMesh(){
        
        if(this.skyLightRQueue.length){
            this.readyNeighbors()
            this.unspreadSkyLight()
            this.lightDirty=frameCount
            this.unspreadDirty=frameCount
            someLightingChanged=true
        }
        if(this.blockLightRQueue.length){
            this.readyNeighbors()
            this.unspreadBlockLight()
            this.lightDirty=frameCount
            this.unspreadDirty=frameCount
            someLightingChanged=true
        }
        
        if(this.skyLightQueue.length && frameCount>this.unspreadDirty+4){
            this.readyNeighbors()
            this.spreadSkyLight()
            this.lightDirty=frameCount
            this.unspreadDirty=0
            someLightingChanged=true
        }
        if(this.blockLightQueue.length && frameCount>this.unspreadDirty+4){
            this.readyNeighbors()
            this.spreadBlockLight()
            this.lightDirty=frameCount
            this.unspreadDirty=0
            someLightingChanged=true
        }
        
        if(this.dirty && !dirtiedThisFrame || keys.t){
            dirtiedThisFrame=true
            this.dirty=false
            this.constructMesh()
        }
        
        if(frameCount>this.lightDirty+4){
            this.constructMesh()
            this.lightDirty=Infinity
        }
        
        profiler.numFaces+=this.indexAmount/6
        gl.bindVertexArray(this.vao)

        let scale=this.scale
        this.data=data

        this.constructMesh()

        this.prunePz=player.z<this.minZ

class Item{
    constructor(x,y,z,vx,vy,vz,type,count=1){
        this.type=type
        this.count=count
        this.x=x
        this.y=y
        this.z=z
        this.vx=vx
        this.vy=vy
        this.vz=vz
        this.vao=count>1?item2VAO:item1VAO
        this.indexAmount=count>1?item2IndexAmount:item1IndexAmount
        this.position=new Float32Array(4)
        this.height=0.3
        this.width=this.height*0.5
        this.life=5*60
        this.tex=[textureSlice[type*3],textureSlice[type*3+1],textureSlice[type*3+2]]
        
        this.lighting=[0,0]
        this.sampleLight()
    }
    sampleLight(){
        let l=getLight(Math.round(this.x),Math.round(this.y),Math.round(this.z))
        this.lighting[0]=l>>4
        this.lighting[1]=l&0x0f
    }
    update(){
        
        let d=1/(dt*(this.grounded?12:0.5)+1)
        this.vx*=d
        this.vz*=d
        this.vy-=dt*10
        
        doCollisionX(this,this.vx*dt)
        doCollisionY(this,this.vy*dt)
        doCollisionZ(this,this.vz*dt)
        
        if(!(this.life&3) && this.count>0){
            for(let i=objects.length;i--;){
                let o=objects[i]
                if(o instanceof Item && o!==this && o.type===this.type && Math.abs(o.x-this.x)+Math.abs(o.y-this.y)+Math.abs(o.z-this.z)<1){
                    o.count+=this.count
                    o.vao=item2VAO
                    o.indexAmount=item2IndexAmount
                    this.count=0
                    return true
                }
            }
        }
        
        let w=player.width
        if(!(frameCount&3) && this.life<299 && aabbTest(player.x-w,player.x+w,player.y,player.y+player.height,player.z-w,player.z+w,this.x-1,this.x+1,this.y-0.1,this.y+0.3,this.z-1,this.z+1)){
            
            let n=player.distributeToInventory(this.type,this.count,false)
            if(n>0)
                this.count-=n
            else{
                this.life=0.1
                
                this.update=function(){
                    let dx=player.x-this.x,
                        dy=player.y+0.75-this.y,
                        dz=player.z-this.z,
                        d=Math.sqrt(dx*dx+dy*dy+dz*dz),
                        m=12/d
                        
                    if(d<0.1)this.life=0
                    
                    dx*=m
                    dy*=m
                    dz*=m
                    this.x+=dx*dt
                    this.y+=dy*dt
                    this.z+=dz*dt
                    this.render()
                    
                    return (this.life-=dt)<=0
                }
            }
        }
        
        if(someLightingChanged)this.sampleLight()
        
        this.render()
        
        return (this.life-=dt)<=0
    }
    render(){
        let dx=player.x-this.x,
            dy=player.y-this.y,
            dz=player.z-this.z,
            v=viewInfo.camDir
        
        if(dx*v[0]+dy*v[1]+dz*v[2]<0)return
        
        this.position[0]=this.x
        this.position[1]=this.y+Math.sin(this.life)*0.1+0.15
        this.position[2]=this.z
        this.position[3]=this.life
        D.setUniform('position',this.position)
        D.setUniform('light',this.lighting)
        D.setUniform('texSlice',this.tex)
        
        profiler.numFaces+=this.indexAmount/6
        gl.bindVertexArray(this.vao)
        gl.drawElements(gl.TRIANGLES,this.indexAmount,gl.UNSIGNED_INT,0)
    }
}

    if(dir[0]<0){minX+=cutX}else{maxX-=cutX}
    if(dir[2]<0){minZ+=cutZ}else{maxZ-=cutZ}
    
    for(let x=minX;x<=maxX;x++){
        for(let z=minZ;z<=maxZ;z++){
            let chunk=getChunk(x,z)
            if(!chunk){
                let d=(snappedX-x)*(snappedX-x)+(snappedZ-z)*(snappedZ-z)
                chunksToGenerate.push([x,z,d,-1])
                continue
            }
            chunkT++
            if(chunk.frustumCulling()){
                let dx=chunk.mx-player.x,

                chunk.distToPlayer=dx*dx+dz*dz
                chunksToRender.push(chunk)

            }

            if(profiler.gpu.length>profileRange)
                profiler.gpu.shift()
            
            gl.deleteQuery(profiler.query)
            profiler.query=gl.createQuery()
            profiler.pending=false
        }
    }
    
    let cpu=0,gpu=0
    profiler.cpu.push(performance.now()-now)
    if(profiler.cpu.length>profileRange)
       profiler.cpu.shift()
    
    for(let i=0;i<profileRange;i++){
        if(i<profiler.cpu.length)cpu+=profiler.cpu[i]
        if(i<profiler.gpu.length)gpu+=profiler.gpu[i]
    }
    cpu/=profiler.cpu.length
    gpu/=profiler.gpu.length
    
    if(!(frameCount&3)){
        profiler.fps=1/dt
        profiler.cpuFps=1000/cpu
        profiler.gpuFps=1000/gpu
    }
    
    if(keys.y){
        let s=15,y=-s+14
        ctx.fillText('fps: '+profiler.fps.toFixed(2),5,y+=s)
        ctx.fillText('CPU: '+cpu.toFixed(2)+'   '+profiler.cpuFps.toFixed(1),5,y+=s)
        ctx.fillText('GPU: '+gpu.toFixed(2)+'   '+profiler.gpuFps.toFixed(1),5,y+=s)
        let tSize=chunks.size,nxn=1
        for(let i=0;i<lodChunks.length;i++)tSize+=lodChunks[i].size
        let inRange=(renderDist*2+1)*(renderDist*2+1)
        for(let i=0;i<lodRanges.length;i++)inRange+=(lodRanges[i][1]*2+1)*(lodRanges[i][1]*2+1)-((lodRanges[i][0]-1)*2+1)*((lodRanges[i][0]-1)*2+1)
        
        ctx.fillText('chunks: '+chunkR.toLocaleString()+' rendered / '+chunkT.toLocaleString()+' iterated / '+inRange.toLocaleString()+' in-range / '+tSize.toLocaleString()+' active',5,y+=s)
        ctx.fillText('LODs: '+chunks.size.toLocaleString()+' [1x1] / '+lodChunks.map(x=>x.size.toLocaleString()+' ['+((nxn+=nxn)+'x'+nxn)+']').join(' / '),5,y+=s)
        ctx.fillText('meshes: '+profiler.numFaces.toLocaleString()+' faces / '+(profiler.numFaces*4).toLocaleString()+' verts / '+(profiler.numFaces*2).toLocaleString()+' tris',5,y+=s)
        ctx.fillText('entities: '+objects.length,5,y+=s)
        ctx.fillText('snapped: '+Math.floor(player.x*div16)+','+Math.floor(player.z*div16),5,y+=s)
        ctx.fillText('position: '+player.x.toFixed(2)+','+player.y.toFixed(2)+','+player.z.toFixed(2),5,y+=s)
        ctx.fillText('facing:'+viewInfo.camDir.map(x=>' '+(-x).toFixed(2)),5,y+=s)
        ctx.fillText('mem MB: '+(performance.memory.usedJSHeapSize/1048576).toFixed(2),5,y+=s)
        let count=0
        for(let i=0;i<numWorkers;i++)if(workers[i].busy)count++
        ctx.fillText('workers busy: '+count+'/'+numWorkers,5,y+=s)
    }
    ctx.beginPath()
    ctx.moveTo(halfWidth,halfHeight-5)
    ctx.lineTo(halfWidth,halfHeight+5)
    ctx.moveTo(halfWidth-5,halfHeight)
    ctx.lineTo(halfWidth+5,halfHeight)
    ctx.stroke()
    profiler.numFaces=0
    
    then=now
    window.parent.raf=window.requestAnimationFrame(loop)
}


if(window.parent.raf)window.cancelAnimationFrame(window.parent.raf)
loop(then=performance.now())

}

main(window.SAVE_CODE)
</script>
